<svg xmlns="http://www.w3.org/2000/svg" width="850" height="600" viewBox="0 0 850 600" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background-color:#fff"><text x="40" y="42" font-size="22" font-weight="bold" fill="#002147">Share of global land area covered by forest, 1990 to 2020</text><text x="40" y="66" font-size="14" fill="#333">Forest includes natural and planted forests over half a hectare.</text><line x1="40" y1="520.0" x2="70" y2="520.0" stroke="#e6e6e6" stroke-width="1"/><text x="78" y="524.0" font-size="12" fill="#333">29</text><line x1="40" y1="414.0" x2="70" y2="414.0" stroke="#e6e6e6" stroke-width="1"/><text x="78" y="418.0" font-size="12" fill="#333">30</text><line x1="40" y1="308.0" x2="70" y2="308.0" stroke="#e6e6e6" stroke-width="1"/><text x="78" y="312.0" font-size="12" fill="#333">31</text><line x1="40" y1="202.0" x2="70" y2="202.0" stroke="#e6e6e6" stroke-width="1"/><text x="78" y="206.0" font-size="12" fill="#333">32</text><line x1="40" y1="96.0" x2="70" y2="96.0" stroke="#e6e6e6" stroke-width="1"/><text x="78" y="100.0" font-size="12" fill="#333">33</text><text x="78" y="82" font-size="12" fill="#333">% of land</text><polyline points="2030.0,159.6 2035.0,191.4 2040.0,212.6 2045.0,244.4 2050.0,265.6 2055.0,286.8 2060.0,297.4" fill="none" stroke="#0f8558" stroke-width="2.5"/><text x="40" y="80" font-size="12" font-weight="bold" fill="#0f8558">Global forest area</text><text x="40.0" y="542" font-size="12" fill="#333" text-anchor="middle">1990</text><text x="47.5" y="542" font-size="12" fill="#333" text-anchor="middle">1998</text><text x="55.0" y="542" font-size="12" fill="#333" text-anchor="middle">2006</text><text x="62.5" y="542" font-size="12" fill="#333" text-anchor="middle">2014</text><text x="70.0" y="542" font-size="12" fill="#333" text-anchor="middle">2020</text><line x1="40" y1="520" x2="70" y2="520" stroke="#999" stroke-width="1"/><text x="40" y="584" font-size="11" fill="#999">Data: illustrative synthetic series for practice purposes.</text></svg>